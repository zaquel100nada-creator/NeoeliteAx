<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LETTERS AX | Painel de Gestão</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root { 
            --bg: #050508; 
            --card-bg: #0e0e14; 
            --border: #242038; 
            --accent: #8a2be2; 
            --accent-glow: rgba(138, 43, 226, 0.4);
            --text: #f0f0f5; 
            --text-muted: #8a8a9e; 
            --danger: #ff334b; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: 'Inter', sans-serif; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 16px; 
        }

        .container { 
            background: var(--card-bg); 
            border: 1px solid var(--border); 
            padding: 28px; 
            border-radius: 16px; 
            width: 100%; 
            max-width: 440px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 20px rgba(138, 43, 226, 0.1);
            animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        h1, h2, h3 { font-family: 'Orbitron', sans-serif; text-transform: uppercase; }
        .logo { text-align: center; font-size: 2rem; margin-bottom: 24px; letter-spacing: 2px; }
        .logo span { color: var(--accent); text-shadow: 0 0 12px var(--accent-glow); }

        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
        .menu-icon { font-size: 1.6rem; color: var(--accent); cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: 0.2s; background: rgba(138,43,226,0.05); }
        .menu-icon:hover { background: rgba(138,43,226,0.15); }

        .input-group { margin-bottom: 14px; text-align: left; }
        label { display: block; font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; font-weight: 600; }
        input { width: 100%; padding: 12px 14px; background: #07070a; border: 1px solid var(--border); border-radius: 8px; color: white; font-size: 0.95rem; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }

        .btn { width: 100%; padding: 14px; background: var(--accent); border: none; border-radius: 8px; color: white; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 0.9rem; text-transform: uppercase; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px var(--accent-glow); margin-top: 10px; }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn.secondary { background: transparent; border: 1px solid var(--accent); color: var(--accent); box-shadow: none; }
        .btn.secondary:hover { background: rgba(138,43,226,0.1); }
        .btn.danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); box-shadow: none; }
        .btn.danger:hover { background: rgba(255, 51, 75, 0.1); }

        /* Stats Box com cálculos automáticos */
        .stats-box { background: #07070a; border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .stat-card { background: #111118; border: 1px solid var(--border); padding: 12px; border-radius: 8px; text-align: center; }
        .stat-value { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; color: var(--accent); margin-top: 4px; }

        /* Lista de Membros com Sticker Black / Mystery Player */
        .player-item { display: flex; align-items: center; background: #07070a; border: 1px solid var(--border); padding: 10px 14px; border-radius: 10px; margin-bottom: 10px; transition: 0.2s; }
        .player-item:hover { border-color: var(--accent); }
        .mystery-avatar { width: 42px; height: 42px; background: #030305; border: 1px solid var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 14px; position: relative; overflow: hidden; box-shadow: 0 0 8px var(--accent-glow); }
        .mystery-avatar img { width: 85%; opacity: 0.85; filter: drop-shadow(0 0 2px var(--accent)); }
        
        .player-info h4 { font-size: 0.95rem; font-weight: 600; }
        .player-info span { font-size: 0.75rem; color: var(--text-muted); }

        .hidden { display: none !important; }
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #111118; border: 1px solid var(--accent); color: white; padding: 12px 24px; border-radius: 8px; font-size: 0.9rem; box-shadow: 0 10px 25px rgba(0,0,0,0.8); display: none; z-index: 9999; animation: toastIn 0.3s ease; }
        @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }
    </style>
</head>
<body>

    <!-- 1. TELA DE LOGIN -->
    <div class="container" id="authView">
        <div class="logo">LETTERS <span>AX</span></div>
        <p style="text-align:center; color:var(--text-muted); font-size: 0.85rem; margin-bottom: 24px;">Painel tático profissional de gestão de equipes.</p>
        <button class="btn" onclick="loginWithGoogle()">ENTRAR COM GOOGLE</button>
    </div>

    <!-- 2. REGISTRO DE NICK -->
    <div class="container hidden" id="nicknameView">
        <div class="logo">REGISTRAR <span>PERFIL</span></div>
        <div class="input-group">
            <label>Seu Nick / Nome de Jogador</label>
            <input type="text" id="inputNick" placeholder="Ex: Zaqz">
        </div>
        <button class="btn" onclick="saveNickname()">AVANÇAR</button>
    </div>

    <!-- 3. CRIAR OU ENTRAR EM TIME -->
    <div class="container hidden" id="teamChoiceView">
        <div class="logo">SEU <span>TIME</span></div>
        <button class="btn" onclick="showSubView('createTeamForm')">CRIAR NOVO TIME</button>
        <button class="btn secondary" onclick="showSubView('joinTeamForm')" style="margin-top:12px;">ENTRAR EM UM TIME</button>

        <div id="createTeamForm" class="hidden" style="margin-top:20px; border-top:1px solid var(--border); padding-top:15px;">
            <div class="input-group"><label>Nome do Time</label><input type="text" id="newTeamName" placeholder="Ex: Neo Elite"></div>
            <div class="input-group"><label>Sua Função (Cargo)</label><input type="text" id="newTeamRole" placeholder="Ex: Dono / Capitão"></div>
            <button class="btn" onclick="createTeam()">CONFIRMAR CRIAÇÃO</button>
        </div>

        <div id="joinTeamForm" class="hidden" style="margin-top:20px; border-top:1px solid var(--border); padding-top:15px;">
            <div class="input-group"><label>ID do Time</label><input type="text" id="joinTeamId" placeholder="Ex: AX-F9AGK"></div>
            <div class="input-group"><label>Sua Função</label><input type="text" id="joinTeamRole" placeholder="Ex: Jogador / Suporte"></div>
            <button class="btn" onclick="joinTeam()">ENTRAR NO TIME</button>
        </div>
    </div>

    <!-- 4. DASHBOARD PRINCIPAL -->
    <div class="container hidden" id="dashboardView">
        <div class="header-flex">
            <div>
                <span id="userBadgeRole" style="color:var(--accent); font-size:0.65rem; font-weight:700; letter-spacing: 1px;"></span>
                <h2 id="dashTeamName" style="font-size:1.3rem;">TIME</h2>
            </div>
            <div class="menu-icon" onclick="showView('menuView')">⋮</div>
        </div>

        <!-- Bloco de Estatísticas e Cálculos Automáticos -->
        <div class="stats-box">
            <h3 style="font-size:0.8rem; color:var(--text-muted); display:flex; justify-content:space-between; align-items:center;">
                ESTATÍSTICAS GLOBAIS <span style="font-size: 0.65rem; color:var(--accent);">● SOMA AUTOMÁTICA</span>
            </h3>
            <div class="stats-grid">
                <div class="stat-card">
                    <label>VITÓRIAS</label>
                    <div class="stat-value" id="statWins">0</div>
                </div>
                <div class="stat-card">
                    <label>PONTOS / KILLS</label>
                    <div class="stat-value" id="statKills">0</div>
                </div>
            </div>
        </div>

        <h3 style="font-size:0.8rem; color:var(--text-muted); margin-bottom: 10px;">ROSTER DA EQUIPE</h3>
        <div id="membersListContainer" style="max-height: 200px; overflow-y: auto; padding-right: 4px;"></div>
    </div>

    <!-- 5. MENU DE OPÇÕES (ABRIDO PELOS TRÊS PONTOS ⋮) -->
    <div class="container hidden" id="menuView">
        <div class="logo" style="margin-bottom:15px;">MENU DE <span>AÇÃO</span></div>
        <button class="btn secondary" onclick="showView('statsEditorView')" id="btnMenuStats">Gerenciar Metas e Estatísticas</button>
        
        <!-- Opção exclusiva do Dono -->
        <div id="ownerMenuOptions" class="hidden">
            <button class="btn danger" onclick="deleteTeamAction()" style="margin-top:10px;">EXCLUIR TIME</button>
        </div>
        
        <!-- Opção para Membro / Dono sair -->
        <button class="btn danger" onclick="leaveTeamAction()" id="btnLeaveTeam" style="margin-top:10px;">Sair do Time</button>
        <button class="btn secondary" onclick="logoutAccount()" style="margin-top:10px; border-color:var(--text-muted); color:var(--text-muted);">Sair da Conta</button>
        <button class="btn" onclick="showView('dashboardView')" style="margin-top:20px;">VOLTAR</button>
    </div>

    <!-- 6. EDITOR DE METAS E STATS -->
    <div class="container hidden" id="statsEditorView">
        <div class="logo">EDITAR <span>ESTATS</span></div>
        <div class="input-group"><label>Adicionar / Atualizar Vitórias</label><input type="number" id="inputEditWins" placeholder="Ex: 5"></div>
        <div class="input-group"><label>Adicionar / Atualizar Pontos/Kills</label><input type="number" id="inputEditKills" placeholder="Ex: 120"></div>
        <button class="btn" onclick="saveStatsAction()">ATUALIZAR DADOS</button>
        <button class="btn secondary" onclick="showView('menuView')" style="margin-top:10px;">CANCELAR</button>
    </div>

    <div id="toast">Notificação</div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBmYPkg0cvlcswmBOaIr5fDPjzZSiRfYJw", authDomain: "neocard-79375.firebaseapp.com", databaseURL: "https://neocard-79375-default-rtdb.firebaseio.com", projectId: "neocard-79375", storageBucket: "neocard-79375.firebasestorage.app", messagingSenderId: "623626301171", appId: "1:623626301171:web:f80196b68060507a3ed186" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function showView(viewId) {
            ['authView', 'nicknameView', 'teamChoiceView', 'dashboardView', 'menuView', 'statsEditorView'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
        }

        function showSubView(subId) {
            document.getElementById('createTeamForm').classList.add('hidden');
            document.getElementById('joinTeamForm').classList.add('hidden');
            document.getElementById(subId).classList.remove('hidden');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2500);
        }

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            firebase.auth().signInWithRedirect(provider);
        }

        // Persistência nativa do Firebase via onAuthStateChanged
        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                db.ref('users/' + user.uid).once('value').then(snap => {
                    const data = snap.val();
                    if (!data || !data.nickname) {
                        showView('nicknameView');
                    } else if (!data.teamId) {
                        showView('teamChoiceView');
                    } else {
                        loadDashboardData(user.uid, data.teamId);
                    }
                });
            } else {
                showView('authView');
            }
        });

        function saveNickname() {
            const nick = document.getElementById('inputNick').value.trim();
            if(!nick) { showToast("Insira um nick válido!"); return; }
            const user = firebase.auth().currentUser;
            db.ref('users/' + user.uid).update({ nickname: nick }).then(() => {
                showToast("Nick salvo com sucesso!");
                showView('teamChoiceView');
            });
        }

        function createTeam() {
            const teamName = document.getElementById('newTeamName').value.trim();
            const role = document.getElementById('newTeamRole').value.trim();
            if(!teamName || !role) { showToast("Preencha todos os campos!"); return; }

            const user = firebase.auth().currentUser;
            const teamId = 'AX-' + Math.random().toString(36).substring(2, 7).toUpperCase();

            db.ref('teams/' + teamId).set({
                name: teamName,
                owner: user.uid,
                stats: { wins: 0, kills: 0 }
            }).then(() => {
                db.ref('users/' + user.uid).update({
                    teamId: teamId,
                    role: role,
                    isOwner: true
                }).then(() => {
                    showToast("Time criado!");
                    loadDashboardData(user.uid, teamId);
                });
            });
        }

        function joinTeam() {
            const teamId = document.getElementById('joinTeamId').value.trim().toUpperCase();
            const role = document.getElementById('joinTeamRole').value.trim();
            if(!teamId || !role) { showToast("Preencha os campos!"); return; }

            db.ref('teams/' + teamId).once('value').then(snap => {
                if(!snap.exists()) { showToast("Time não encontrado!"); return; }
                const user = firebase.auth().currentUser;
                db.ref('users/' + user.uid).update({
                    teamId: teamId,
                    role: role,
                    isOwner: false
                }).then(() => {
                    showToast("Entrou no time com sucesso!");
                    loadDashboardData(user.uid, teamId);
                });
            });
        }

        function loadDashboardData(uid, teamId) {
            showView('dashboardView');

            // Carrega info do time e stats
            db.ref('teams/' + teamId).on('value', snap => {
                const team = snap.val();
                if(!team) return;
                document.getElementById('dashTeamName').innerText = team.name;
                const stats = team.stats || { wins: 0, kills: 0 };
                document.getElementById('statWins').innerText = stats.wins;
                document.getElementById('statKills').innerText = stats.kills;
            });

            // Verifica permissões do usuário logado para o menu
            db.ref('users/' + uid).on('value', snap => {
                const uData = snap.val();
                document.getElementById('userBadgeRole').innerText = `${uData.role || 'MEMBRO'} • ${uData.isOwner ? 'DONO' : 'JOGADOR'}`;
                
                if(uData.isOwner) {
                    document.getElementById('ownerMenuOptions').classList.remove('hidden');
                    document.getElementById('btnMenuStats').classList.remove('hidden');
                } else {
                    document.getElementById('ownerMenuOptions').classList.add('hidden');
                    document.getElementById('btnMenuStats').classList.add('hidden');
                }
            });

            // Carrega Lista de Membros com Mystery Player Avatar (Sticker Black)
            db.ref('users').orderByChild('teamId').equalTo(teamId).on('value', membersSnap => {
                const container = document.getElementById('membersListContainer');
                container.innerHTML = '';
                membersSnap.forEach(mSnap => {
                    const m = mSnap.val();
                    container.innerHTML += `
                        <div class="player-item">
                            <div class="mystery-avatar">
                                <img src="https://api.iconify.design/lucide:user-cog.svg?color=%238a2be2" alt="Player">
                            </div>
                            <div class="player-info">
                                <h4>${m.nickname}</h4>
                                <span>${m.role || 'Membro'}</span>
                            </div>
                        </div>
                    `;
                });
            });
        }

        function saveStatsAction() {
            const addWins = parseInt(document.getElementById('inputEditWins').value) || 0;
            const addKills = parseInt(document.getElementById('inputEditKills').value) || 0;
            const user = firebase.auth().currentUser;

            db.ref('users/' + user.uid).once('value').then(snap => {
                const teamId = snap.val().teamId;
                const teamRef = db.ref('teams/' + teamId + '/stats');
                
                teamRef.once('value', sSnap => {
                    const current = sSnap.val() || { wins: 0, kills: 0 };
                    const newWins = Number(current.wins) + addWins;
                    const newKills = Number(current.kills) + addKills;

                    teamRef.update({ wins: newWins, kills: newKills }).then(() => {
                        showToast("Estatísticas somadas e atualizadas!");
                        document.getElementById('inputEditWins').value = '';
                        document.getElementById('inputEditKills').value = '';
                        showView('dashboardView');
                    });
                });
            });
        }

        function deleteTeamAction() {
            const user = firebase.auth().currentUser;
            db.ref('users/' + user.uid).once('value').then(snap => {
                const teamId = snap.val().teamId;
                db.ref('teams/' + teamId).remove().then(() => {
                    db.ref('users').orderByChild('teamId').equalTo(teamId).once('value', allUsers => {
                        allUsers.forEach(us => {
                            db.ref('users/' + us.key).update({ teamId: null, role: null, isOwner: false });
                        });
                    }).then(() => {
                        showToast("Time excluído permanentemente.");
                        location.reload();
                    });
                });
            });
        }

        function leaveTeamAction() {
            const user = firebase.auth().currentUser;
            db.ref('users/' + user.uid).update({ teamId: null, role: null, isOwner: false }).then(() => {
                showToast("Você saiu do time.");
                location.reload();
            });
        }

        function logoutAccount() {
            firebase.auth().signOut().then(() => {
                location.reload();
            });
        }
    </script>
</body>
</html>
