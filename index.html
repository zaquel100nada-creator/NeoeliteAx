<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AX CARDS | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root { --bg: #050505; --card: #0d0d10; --accent: #ff7700; --text: #e1e1e1; --danger: #ff3300; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .menu-btn { font-size: 24px; cursor: pointer; color: var(--accent); }
        
        /* Card Estilizado */
        .card-stats { background: var(--card); border: 1px solid #222; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .stat-item { background: #15151a; padding: 10px; border-radius: 8px; text-align: center; }
        
        /* Mystery Player Avatar */
        .player-card { display: flex; align-items: center; background: var(--card); padding: 10px; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid var(--accent); }
        .avatar { width: 40px; height: 40px; background: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 15px; font-size: 20px; }
        
        button { width: 100%; padding: 12px; background: var(--accent); border: none; border-radius: 8px; color: #000; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .secondary { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="authBox" class="container">
        <h1 style="text-align:center; font-family:Orbitron;">AX <span style="color:var(--accent)">CARDS</span></h1>
        <button onclick="login()">ENTRAR COM GOOGLE</button>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="container hidden">
        <div class="header">
            <div><small style="color:var(--accent)">TIME ATUAL</small><h2 id="teamNameDisplay">Carregando...</h2></div>
            <div class="menu-btn" onclick="showView('menuView')">⋮</div>
        </div>

        <div class="card-stats">
            <h3>ESTATÍSTICAS</h3>
            <div class="stat-grid">
                <div class="stat-item"><small>VITÓRIAS</small><div id="winsCount" style="font-size:20px; font-weight:bold;">0</div></div>
                <div class="stat-item"><small>KILLS/OBJ</small><div id="killsCount" style="font-size:20px; font-weight:bold;">0</div></div>
            </div>
        </div>

        <div id="membersList"></div>
    </div>

    <!-- MENU VIEW -->
    <div id="menuView" class="container hidden">
        <h2 style="font-family:Orbitron;">MENU</h2>
        <div id="ownerMenu" class="hidden">
            <button class="secondary" onclick="showView('statsEditor')">Gerenciar Metas/Stats</button>
            <button style="border-color:var(--danger); color:var(--danger);" onclick="deleteTeam()">EXCLUIR TIME</button>
        </div>
        <button class="secondary" onclick="leaveTeam()">Sair do Time</button>
        <button onclick="showView('dashboard')">VOLTAR</button>
    </div>

    <!-- ESTATÍSTICAS EDITOR -->
    <div id="statsEditor" class="container hidden">
        <h2 style="font-family:Orbitron;">ATUALIZAR STATS</h2>
        <input type="number" id="inWins" placeholder="Vitórias" style="width:100%; padding:10px; margin-bottom:10px;">
        <input type="number" id="inKills" placeholder="Kills/Meta" style="width:100%; padding:10px;">
        <button onclick="updateStats()">SALVAR STATS</button>
        <button class="secondary" onclick="showView('menuView')">CANCELAR</button>
    </div>

    <script>
        const firebaseConfig = { /* SEU CONFIG AQUI */ };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function showView(id) {
            ['authBox', 'dashboard', 'menuView', 'statsEditor'].forEach(v => document.getElementById(v).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function login() { firebase.auth().signInWithRedirect(new firebase.auth.GoogleAuthProvider()); }

        firebase.auth().onAuthStateChanged(user => {
            if(user) {
                db.ref('users/' + user.uid).on('value', snap => {
                    const data = snap.val();
                    if(!data || !data.teamId) { showView('authBox'); return; }
                    
                    // Carrega Dashboard
                    showView('dashboard');
                    document.getElementById('teamNameDisplay').innerText = data.teamName || "Sem Nome";
                    if(data.isOwner) document.getElementById('ownerMenu').classList.remove('hidden');
                    
                    // Carrega Stats
                    db.ref('teams/' + data.teamId + '/stats').on('value', s => {
                        const st = s.val() || {wins:0, kills:0};
                        document.getElementById('winsCount').innerText = st.wins;
                        document.getElementById('killsCount').innerText = st.kills;
                    });

                    // Carrega Membros (Mystery Players)
                    db.ref('users').orderByChild('teamId').equalTo(data.teamId).on('value', mems => {
                        const list = document.getElementById('membersList');
                        list.innerHTML = '';
                        mems.forEach(m => {
                            list.innerHTML += `
                                <div class="player-card">
                                    <div class="avatar">👤</div>
                                    <div><strong>${m.val().nickname}</strong><br><small>${m.val().role || 'Membro'}</small></div>
                                </div>`;
                        });
                    });
                });
            }
        });

        function updateStats() {
            const wins = document.getElementById('inWins').value;
            const kills = document.getElementById('inKills').value;
            const uid = firebase.auth().currentUser.uid;
            db.ref('users/' + uid).once('value', snap => {
                db.ref('teams/' + snap.val().teamId + '/stats').update({wins: wins, kills: kills});
                showView('dashboard');
            });
        }

        function deleteTeam() {
            const uid = firebase.auth().currentUser.uid;
            db.ref('users/' + uid).once('value', s => {
                db.ref('teams/' + s.val().teamId).remove();
                db.ref('users/' + uid).update({teamId: null, isOwner: false});
                location.reload();
            });
        }

        function leaveTeam() {
            const uid = firebase.auth().currentUser.uid;
            db.ref('users/' + uid).update({teamId: null, isOwner: false});
            location.reload();
        }
    </script>
</body>
</html>
